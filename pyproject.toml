[project]
name = "legalbot"
version = "0.1.0"
description = "Greenfield FastAPI + LangGraph + Celery legalbot automation"
authors = [
    { name = "Camilo Romero", email = "camilo.romero@allstacks.com" }
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    # Validation / settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "jsonschema>=4.23.0",
    "jsonpatch>=1.33",
    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "deepagents>=0.1.0",
    # Celery
    "celery>=5.4.0",
    "celery-redbeat>=2.2.0",
    "redis>=5.0.0",
    # Providers
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "msgraph-sdk>=1.9.0",
    # Attachments
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    # Secrets
    "cryptography>=43.0.0",
    # Observability
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "starlette-prometheus>=0.10.0",
    "prometheus-client>=0.21.0",
    # Utils
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "python-multipart>=0.0.17",
    "orjson>=3.10.7",
    "langmem>=0.0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.1",
    "testcontainers[postgres,redis]>=4.8.2",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "freezegun>=1.5.1",
    "types-jsonschema>=4.23.0",
]

[project.scripts]
legalbot = "legalbot.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "N", "TID"]
ignore = [
    "E501",
    "B008",     # FastAPI Depends idiom
    "N818",     # domain exceptions mirror stdlib (LookupError, RuntimeError) without Error suffix
    "UP047",    # PEP 695 type params; opt in gradually
    "RUF005",   # iterable unpacking — keep readable +-concat
    "RUF012",   # ClassVar annotation — explicit init idiom is fine
    "RUF013",   # implicit Optional left for InjectedState defaults where the runtime tolerates it
    "SIM102",
    "SIM105",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "N", "SIM"]
"alembic/versions/**" = ["N"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests needing docker services",
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
source = ["legalbot"]
omit = ["*/__main__.py"]
